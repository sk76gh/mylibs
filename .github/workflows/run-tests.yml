name: Python Unit Tests

# Trigger this workflow on every code push or pull request to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Downloads a copy of your repository code onto the runner machine
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Installs Python onto the virtual environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.11' # Match your local Python version

    # 3. Installs dependencies if you have them (e.g., python-dotenv)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Executes the exact terminal command you ran in your Codespace
    - name: Run Unit Tests
      run: |
        python -m unittest test_config.py
