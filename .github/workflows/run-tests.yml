name: Python Unit Tests

# Trigger this workflow on every code push or pull request to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Downloads a copy of your repository code onto the runner machine
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Installs Python onto the virtual environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.14.2' # Match your local Python version

    # 3. ONLY installs dependencies if this run is a Pull Request
    - name: Install dependencies
      if: github.event_name == 'pull_request'  # 👈 Condition
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 3. ONLY executes unit tests if this run is a direct Push
    - name: Run Unit Tests
      if: github.event_name == 'push'          # 👈 Condition
      env:
        PYTHONPATH: mylibs
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -m unittest mylibs/test_config.py

    